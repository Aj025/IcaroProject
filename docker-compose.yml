services:
  postgres:
    image: postgres:16-alpine
    container_name: icaro-db
    environment:
      POSTGRES_DB: icaro
      POSTGRES_USER: icaro
      POSTGRES_PASSWORD: icaro_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icaro"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - icaro-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icaro-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://icaro:icaro_dev_pass@postgres:5432/icaro
      NODE_ENV: development
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-dev_jwt_secret}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-dev_n8n_secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - icaro-net

  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: icaro-api-dev
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://icaro:icaro_dev_pass@postgres:5432/icaro
      NODE_ENV: development
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-dev_jwt_secret}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-dev_n8n_secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - icaro-net

  n8n:
    image: n8nio/n8n:latest
    container_name: icaro-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_METRICS: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - icaro-net

volumes:
  pgdata:
  n8n_data:

networks:
  icaro-net:
    driver: bridge
